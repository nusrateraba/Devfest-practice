<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Task Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <div>
            <h1>Student Task Tracker</h1>
            <p>Manage your academic tasks easily</p>
        </div>

        <div class="header-buttons">
            <button id="languageBtn">বাংলা</button>
            <button id="themeBtn">🌙</button>
        </div>
    </header>

    <main class="container">

        <section class="dashboard">
            <div class="stat-card">
                <span>Total Tasks</span>
                <strong id="totalTasks">0</strong>
            </div>

            <div class="stat-card">
                <span>Completed</span>
                <strong id="completedTasks">0</strong>
            </div>

            <div class="stat-card">
                <span>Pending</span>
                <strong id="pendingTasks">0</strong>
            </div>

            <div class="stat-card">
                <span>High Priority</span>
                <strong id="highTasks">0</strong>
            </div>
        </section>

        <section class="form-section">
            <h2>Add New Task</h2>

            <form id="taskForm">

                <div class="form-grid">

                    <div class="input-group">
                        <label>Task Name</label>
                        <input type="text" id="taskName" placeholder="Enter task name" required>
                    </div>

                    <div class="input-group">
                        <label>Subject</label>
                        <input type="text" id="subject" placeholder="Enter subject" required>
                    </div>

                    <div class="input-group">
                        <label>Deadline</label>
                        <input type="date" id="deadline" required>
                    </div>

                    <div class="input-group">
                        <label>Priority</label>
                        <select id="priority">
                            <option value="Low">Low</option>
                            <option value="Medium" selected>Medium</option>
                            <option value="High">High</option>
                        </select>
                    </div>

                </div>

                <button class="add-btn" type="submit">+ Add Task</button>

            </form>
        </section>

        <section class="tasks-section">

            <div class="task-header">
                <h2>My Tasks</h2>

                <div class="filters">
                    <button class="filter active" data-filter="all">All</button>
                    <button class="filter" data-filter="pending">Pending</button>
                    <button class="filter" data-filter="completed">Completed</button>
                    <button class="filter" data-filter="high">High Priority</button>
                </div>
            </div>

            <div id="taskList" class="task-list"></div>

        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
